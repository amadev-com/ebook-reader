# docker-compose.yml — Silero TTS server for bookai
#
# Uses the prebuilt biblio-tts-server-silero image, which provides a
# FastAPI REST server for Silero TTS with SSML and stress mark support.
#
# Usage:
#   docker compose up -d          # start the TTS server
#   docker compose logs -f        # watch logs (models load on first request)
#   docker compose down           # stop
#
# The server will be available at http://localhost:5555
# API docs at http://localhost:5555/docs
# OpenAPI spec at http://localhost:5555/openapi.json
#
# Available Russian voices: aidar (M), baya (F), kseniya (F), eugene (M), xenia (F)
# Voice ID format: silero:{model}#{speaker}, e.g. silero:v5_5_ru#xenia

services:
  silero:
    image: vpoluyaktov/biblio-tts-server-silero:latest
    container_name: bookai-silero
    ports:
      - "5555:80"
    environment:
      - SILERO_DEVICE=cpu          # "cpu" or "cuda" (for GPU)
      - SILERO_SERVED_MODELS=v5_5_ru  # comma-separated models to preload
    # For GPU support, uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    restart: unless-stopped
